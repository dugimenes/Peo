apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: peo-platform
  labels:
    app: identity-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
        tier: backend
    spec:
      containers:
      - name: identity-api
        image: <DOCKER_USERNAME>/peo-identity-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ConnectionStrings__DefaultConnection
          value: "Server=sqlserver-service,1433;Database=PeoIdentityDb;User Id=sa;TrustServerCertificate=True;Password=$(DB_PASSWORD)"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: DB_PASSWORD
        - name: JwtOptions__SecretKey
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_SECRET_KEY
        envFrom:
        - configMapRef:
            name: peo-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api-service
  namespace: peo-platform
  labels:
    app: identity-api
spec:
  type: ClusterIP
  selector:
    app: identity-api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
